[workspace]
members = ["contracts/institution", "contracts/factory"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
near-sdk = "=5.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "=1.8.1"
primitive-types = { version = "=0.10.1", default-features = false }
