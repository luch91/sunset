name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Playwright 1.58 supports Chromium on Ubuntu 24.04; pinning prevents the
    # browser suite from silently following the hosted runner to Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:copy
      - run: pnpm test
      - run: pnpm build
      # GitHub's ubuntu-latest may be newer than Playwright's dependency
      # installer supports. Hosted runners already include browser libraries.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - run: cargo fmt --all --check
      - run: cargo build --target wasm32-unknown-unknown --release -p sunset-institution
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --target wasm32-unknown-unknown --release -p sunset-factory
